; Vendo S1 Production Firmware — ESP32-WROOM-32
;
; Port of the STM32F103C8 VendoBoard production firmware
; (c:\vendo\Vendo_Production\VendoBoard_ProductionFirmware, branch `main`)
; onto the ESP32-based Vendo S1 board. Same vend behaviour, same AT+ CLI, same
; LCD config menu; the platform-specific differences are all documented in
; docs/PORTING_FROM_STM32.md and docs/PENDING.md.
;
; Hardware map: ../Vendo_I2C_Master_Slave/docs/hardware/ESP32_Vendo_Board.md
; Bring-up harness (proves the board before this firmware runs): ../Vendo_S1_TestCode
;
; Flashing is MANUAL — J7 (PROG) has no RTS/DTR auto-reset network:
;   1. hold BOOT (SW7)   2. tap RESET (SW1)   3. release BOOT   4. -t upload
; Tap RESET again to run the app.

; DEFAULT IS THE BENCH BUILD (2026-09-14, while nRF Connect is the only client).
;
; A bare `pio run` builds esp32dev-devinfo, which EXPOSES BLE Device Info
; (f001). nRF Connect does not care — it talks to whatever GATT tree exists.
;
; ⚠️ THE MOBILE APP DOES CARE. It decides a board's whole profile on whether
; f001 is present: present => "full", which then requires f004 Session Log,
; f006 Diagnostics and f007 Command. f004 and f006 now exist; **f007 does not**,
; and the app calls acknowledgeSync() with no .catch(), so the connect still
; fails on a board flashed from this default — after the backend upload has
; already succeeded, which is the worst shape for that failure to take.
;
; For any board the app will touch, ask for the safe build by name:
;
;     pio run -e esp32dev -t upload
;
; Flip this back to esp32dev the moment app testing resumes. When f007 lands
; (f004 and f006 are done), ENABLE_BLE_DEVICE_INFO moves into [env:esp32dev] and
; this variant gets deleted.
;
[platformio]
default_envs = esp32dev-devinfo

[env:esp32dev]
; Pinned to the same core the S1 bring-up harness was verified against. The
; LEDC (buzzer tone) API changed between Arduino-ESP32 2.x and 3.x — periph.cpp
; compiles against either, but pinning keeps the bench-verified build stable.
platform  = espressif32@^6.9.0
board     = esp32dev
framework = arduino

upload_speed  = 115200
monitor_speed = 115200

; Custom partition table — the stock default.csv with 128 KB carved out of the
; (unused) SPIFFS region for `vendolog`, the Session Log's event store. NVS and
; both app slots keep their stock offsets on purpose: `nvs` at 0x9000 holds the
; write-once factory serial, and moving it would orphan every provisioned board.
; See partitions_vendo.csv and src/eventlog.h.
;
; A board flashed from an older build keeps its old table until this is uploaded
; — `pio run -t upload` flashes partitions.bin too. Until then the firmware
; prints "`vendolog` partition not found — Session Log (f004) DISABLED" at boot
; and records no events; nothing else is affected.
board_build.partitions = partitions_vendo.csv

; NimBLE instead of the framework's built-in Bluedroid BLEDevice.h — Bluedroid
; cost ~825 KB flash for one 37-byte characteristic (88.4% of the app
; partition total). Pinned to the 1.x line: this platform's
; framework-arduinoespressif32 package is the Arduino-ESP32 2.x/IDF4 line, and
; NimBLE-Arduino 2.x targets IDF5/Arduino-ESP32 3.x.
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.1

; send_on_enter: the AT+ CLI dispatches on CR/LF, so lines must actually be sent.
; echo: J7 is a plain UART with no local echo, so you'd otherwise type blind.
monitor_filters = send_on_enter, direct
monitor_echo    = yes

build_flags =
    -Iinclude
    -DCORE_DEBUG_LEVEL=0
    ; -DVERBOSE_LOG   ; remove for production builds to shrink flash (see include/debug_log.h)
    -DENABLE_CLI      ; remove for production builds to drop the AT+ parser entirely (see src/main.cpp)
    -DENABLE_BLE      ; remove for production builds to drop the BLE GATT config server entirely (see src/ble_config.cpp)
    ; NOTE: Device Info (6a40f001) is NOT built in this environment. It is
    ; OFF ON PURPOSE — see [env:esp32dev-devinfo] at the bottom of this file
    ; for the bench-testing build, and the explanation below.
    ;
    ; The mobile app decides a board's whole profile on whether f001 exists:
    ; present => 'full', absent => 'configOnly'. A configOnly board skips the
    ; sync sequence and goes straight to Config, which is why Config works today.
    ;
    ; Turn this on and the app instead runs writeTimeSync -> readDeviceInfo ->
    ; readLiveCounters -> readConfig -> pullSessionLogDelta -> readDiagnostics,
    ; and the first MISSING characteristic throws — so the connect fails
    ; entirely, including the Config push that works now.
    ;
    ; f002, f003, f004 and f006 are built. The one still missing is f007
    ; (Command) — the app's sync calls acknowledgeSync() unconditionally and
    ; without a .catch(), so enable this only once f007 exists. Safe to enable
    ; for nRF Connect bench testing, which ignores profiles. See
    ; src/ble_deviceinfo.h.

; =============================================================================
; Bench-only variant: the same firmware WITH Device Info (6a40f001).
;
;     pio run -e esp32dev-devinfo -t upload
;
; Exists as its own environment rather than a flag you uncomment, so the safe
; build stays the default and nobody can commit the hazardous one by accident.
;
; DO NOT FLASH THIS TO A BOARD THE MOBILE APP WILL CONNECT TO — see the warning
; under [env:esp32dev]. nRF Connect is fine: it talks to whatever GATT tree the
; board advertises and has no notion of app profiles.
;
; When f007 (Command) lands — f004 and f006 already have —
; ENABLE_BLE_DEVICE_INFO moves into [env:esp32dev] and this environment gets
; deleted.
; =============================================================================
[env:esp32dev-devinfo]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DENABLE_BLE_DEVICE_INFO
